<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<title><?= appTitle ?></title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --brand:#2B3A55; --brand-2:#3b4f75;
  --paper:#f4f2ee; --card:#ffffff; --card-2:#faf8f5;
  --line:#e8e3da; --line-2:#f0ece5;
  --ink:#1c1a17; --ink-2:#4e483f; --muted:#8c847a;
  --good:#2E7D5B; --mid:#A87B22; --low:#B04936; --low-soft:rgba(176,73,54,.12);
  --w:#2E7D5B;    /* 주일예배 */
  --g:#C27A26;    /* 순모임 */
  --r-xl:22px; --r-md:14px;
  --sh-1:0 1px 2px rgba(28,26,23,.04), 0 3px 12px rgba(28,26,23,.05);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  font-size:15px; line-height:1.5; letter-spacing:-.012em; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit; color:inherit;}

/* ---------- 상단 ---------- */
.top{
  position:sticky; top:0; z-index:20; color:#fff;
  background:
    radial-gradient(120% 160% at 90% -50%, rgba(255,255,255,.18), transparent 55%),
    linear-gradient(160deg, var(--brand) 0%, #1e2a40 100%);
  box-shadow:0 6px 24px rgba(0,0,0,.18);
}
.top-in{max-width:1080px; margin:0 auto; padding:14px 16px 10px; display:flex; align-items:center; gap:10px;}
.top-tt{flex:1; min-width:0;}
.top-tt h1{margin:0; font-size:18px; font-weight:700; letter-spacing:-.03em;}
.top-tt p{margin:1px 0 0; font-size:12.5px; opacity:.78;}
.tbtn{
  flex:0 0 auto; border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.14);
  color:#fff; border-radius:11px; padding:8px 12px; font-size:13px; font-weight:500; cursor:pointer;
}
.tbtn:active{background:rgba(255,255,255,.3);}
.ctl{max-width:1080px; margin:0 auto; padding:0 16px 12px;}
.weeks{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding:2px 0;}
.weeks::-webkit-scrollbar{display:none;}
.wk{
  flex:0 0 auto; border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.1); color:#fff;
  border-radius:99px; padding:6px 12px; font-size:13px; font-weight:500; cursor:pointer; white-space:nowrap;
}
.wk.on{background:#fff; color:var(--brand); font-weight:700; border-color:#fff;}

/* ---------- 본문 ---------- */
.wrap{max-width:1080px; margin:0 auto; padding:16px 14px 40px;}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r-xl); box-shadow:var(--sh-1); margin-bottom:14px; overflow:hidden;}
.head{display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:4px 10px; padding:15px 18px 6px;}
.head h2{margin:0; font-size:15.5px; font-weight:700; letter-spacing:-.025em; display:flex; align-items:center; gap:7px;}
.head h2 i{width:9px; height:9px; border-radius:50%; display:inline-block;}
.head span{font-size:12px; color:var(--muted);}

/* 요약 카드 */
.cards{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:14px;}
.cards .kpi:nth-child(3){grid-column:1 / -1;}
@media (min-width:760px){ .cards{grid-template-columns:repeat(3,1fr);} .cards .kpi:nth-child(3){grid-column:auto;} }
.kpi{background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); box-shadow:var(--sh-1); padding:13px 14px 12px; min-width:0;}
.kpi small{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-2); font-weight:700;}
.kpi small i{width:8px; height:8px; border-radius:50%; display:inline-block;}
.kpi b{display:block; font-size:26px; font-weight:700; letter-spacing:-.04em; line-height:1.2; margin-top:3px;}
.kpi b em{font-style:normal; font-size:13px; color:var(--muted); font-weight:500; margin-left:3px;}
.kpi p{margin:3px 0 0; font-size:12px; color:var(--muted);}
.up{color:var(--good); font-weight:700;} .down{color:var(--low); font-weight:700;} .same{color:var(--muted);}
.kpi.alert b{color:var(--low);}

/* 기록 점검 */
.checks{padding:4px 16px 14px;}
.chk{display:flex; gap:10px; padding:10px 0; border-top:1px solid var(--line-2);}
.chk:first-child{border-top:0;}
.chk .ic{flex:0 0 auto; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:#fff;}
.chk .ic.ok{background:var(--good);} .chk .ic.warn{background:var(--mid);}
.chk .tx{flex:1; min-width:0; font-size:13.5px;}
.chk .tx b{display:block; font-size:13.5px;}
.chk .tx div{color:var(--ink-2); font-size:12.5px; margin-top:2px;}
.chk a{color:var(--brand-2); text-decoration:none; white-space:nowrap;}

/* 지역별 출석률 표 */
.hm-wrap{overflow-x:auto; padding:6px 12px 10px;}
table.hm{border-collapse:separate; border-spacing:3px; width:100%; min-width:max-content;}
.hm th, .hm td{font-size:12px; text-align:center; white-space:nowrap;}
.hm thead th{color:var(--muted); font-weight:500; padding:2px 4px;}
.hm thead th.sel{color:var(--brand); font-weight:700;}
.hm th.rh{
  position:sticky; left:0; z-index:2; background:var(--card); text-align:left;
  padding:6px 8px 6px 4px; font-weight:700; font-size:13px; min-width:118px;
}
.hm tr.rr{cursor:pointer;}
.hm tr.rr th.rh .bd{display:inline-flex; width:20px; height:20px; border-radius:6px; color:#fff; font-size:11px; align-items:center; justify-content:center; margin-right:6px; vertical-align:-4px;}
.hm tr.rr th.rh small{font-weight:500; color:var(--muted); font-size:11px; margin-left:4px;}
.hm tr.rr th.rh .arr{color:var(--muted); font-size:10px; margin-left:4px;}
.hm tr.sub th.rh{font-weight:500; font-size:12px; padding-left:30px; color:var(--ink-2);}
.hm tr.sub th.rh small{color:var(--muted); font-size:11px; margin-left:4px;}
.hm td.c{min-width:38px; height:30px; border-radius:7px; font-weight:700; font-size:12px;}
.hm td.c.na{background:repeating-linear-gradient(45deg, #f3efe8, #f3efe8 4px, #faf8f5 4px, #faf8f5 8px); color:#c9c1b4; font-weight:500;}
.hm td.c.sel{box-shadow:inset 0 0 0 2px var(--brand);}
.hm td.avg{min-width:46px; font-weight:700; font-size:12.5px; padding:0 4px;}
.hm tr.sub td.c{height:26px; font-size:11.5px;}
.scale{display:flex; align-items:center; gap:6px; padding:0 16px 14px; font-size:11.5px; color:var(--muted); flex-wrap:wrap;}
.scale i{width:22px; height:12px; border-radius:3px; display:inline-block;}

.foot{font-size:11.5px; color:var(--muted); line-height:1.7; padding:0 6px;}
.msg{padding:14px 16px; border-radius:var(--r-md); background:var(--low-soft); color:var(--low); font-weight:500; margin-bottom:14px;}
.empty{padding:18px 16px 20px; color:var(--muted); font-size:13.5px; text-align:center;}
.loading{padding:60px 0; text-align:center; color:var(--muted);}
.spin{width:28px; height:28px; margin:0 auto 12px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--brand); animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:9px 16px; border-radius:99px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:50;}
.toast.on{opacity:.92;}
.hidden{display:none !important;}

/* ---------- 인쇄 ---------- */
@media print{
  body{background:#fff; font-size:12px;}
  .top{position:static; box-shadow:none; background:#fff; color:var(--ink); border-bottom:2px solid var(--ink);}
  .top-tt p{opacity:1;}
  .tbtn, .ctl{display:none !important;}
  .card, .kpi{box-shadow:none; break-inside:avoid;}
  .hm-wrap{overflow:visible;}
  .hm th.rh{position:static;}
  .cards{grid-template-columns:repeat(3,1fr);}
  .cards .kpi:nth-child(3){grid-column:auto;}
  *{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="top-tt">
      <h1 id="title"><?= appTitle ?></h1>
      <p id="sub">불러오는 중…</p>
    </div>
    <button class="tbtn" onclick="load(true)">새로고침</button>
    <button class="tbtn" onclick="window.print()">인쇄</button>
  </div>
  <div class="ctl">
    <div class="weeks" id="weeks"></div>
  </div>
</header>

<main class="wrap">
  <div id="loading" class="loading"><div class="spin"></div>출석부 10개 지역을 읽는 중입니다…</div>
  <div id="msg" class="msg hidden"></div>

  <div id="body" class="hidden">
    <section class="cards" id="cards"></section>

    <section class="card">
      <div class="head"><h2>기록 점검</h2><span id="checkSub"></span></div>
      <div class="checks" id="checks"></div>
    </section>

    <section class="card">
      <div class="head"><h2><i style="background:var(--w)"></i>지역별 주일예배 출석률</h2><span>지역을 누르면 순별로 펼쳐집니다</span></div>
      <div class="hm-wrap" id="heatW"></div>
      <div class="scale" id="scaleW"></div>
    </section>

    <section class="card">
      <div class="head"><h2><i style="background:var(--g)"></i>지역별 순모임 출석률</h2><span>지역을 누르면 순별로 펼쳐집니다</span></div>
      <div class="hm-wrap" id="heatG"></div>
      <div class="scale" id="scaleG"></div>
    </section>

    <p class="foot" id="foot"></p>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
  var PALETTE = ['#2E7D5B','#3A6EA5','#8D5BA6','#BF6B36','#42806B',
                 '#5F63C4','#A8506A','#2C8683','#8C6B2A','#55697C'];
  // 표 칸 색: 출석률이 높을수록 진하게 (주일예배는 초록, 순모임은 주황 계열)
  var HEAT = {
    w: ['#f3f6f3','#d6ebdd','#a9d3b9','#6fb591','#3f9368','#2E7D5B'],
    g: ['#faf5ee','#f5e3cc','#ebc99c','#dca868','#c9863a','#a8661d']
  };

  var S = { data: null, week: 0, open: {}, rec: {} };

  /* ---------------- 불러오기 ---------------- */
  function load(force){
    document.getElementById('loading').classList.remove('hidden');
    document.getElementById('msg').classList.add('hidden');
    google.script.run
      .withSuccessHandler(function(data){
        S.data = data;
        S.rec = {};
        data.regions.forEach(function(r){
          S.rec[r.id] = { w: recorded(r, 'w'), g: recorded(r, 'g') };
        });
        S.week = Math.max(0, data.weeks.length - 1);
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('body').classList.remove('hidden');
        document.getElementById('title').textContent = data.title + ' 출석 현황';
        document.getElementById('sub').textContent = data.at + ' 기준 · ' + data.regions.length + '개 지역';
        if (force) toast('시트를 다시 읽었습니다');
        render();
      })
      .withFailureHandler(function(err){
        document.getElementById('loading').classList.add('hidden');
        var m = document.getElementById('msg');
        var t = (err && err.message) || '불러오지 못했습니다.';
        if (/권한|permission|access|찾을 수 없습니다/i.test(t)) {
          t = '출석부를 열 권한이 없습니다. 출석부 관리자에게 이 구글 계정으로 시트 공유를 요청해 주세요. (' + t + ')';
        }
        m.textContent = t;
        m.classList.remove('hidden');
      })
      .getDashboard(!!force);
  }
  window.addEventListener('load', function(){ load(false); });

  /* ---------------- 계산 ---------------- */
  function marksOf(m, kind){ return kind === 'g' ? m.g : m.w; }

  // 그 지역에서 한 명이라도 체크한 주만 '기록된 주'로 본다
  function recorded(r, kind){
    var n = S.data.weeks.length, out = [];
    for (var j = 0; j < n; j++){
      var on = false;
      r.groups.forEach(function(g){
        g.members.forEach(function(m){ if (marksOf(m, kind).charAt(j) === '1') on = true; });
      });
      out.push(on);
    }
    return out;
  }

  function applies(r, kind){ return kind === 'w' || r.hasGroup; }

  // members 가운데 j주 출석 인원 / 대상 인원 (그 주가 기록된 경우에만)
  function tally(r, members, kind, j){
    if (!applies(r, kind) || !S.rec[r.id][kind][j]) return null;
    var att = 0, base = 0;
    members.forEach(function(m){
      var c = marksOf(m, kind).charAt(j);
      if (c === '-') return;
      base++;
      if (c === '1') att++;
    });
    return base ? { att: att, base: base, rate: att / base } : null;
  }

  function allMembers(r){
    var a = [];
    r.groups.forEach(function(g){ a = a.concat(g.members); });
    return a;
  }

  function weekStats(kind, j){
    var att = 0, base = 0, done = 0, total = 0;
    S.data.regions.forEach(function(r){
      if (!applies(r, kind)) return;
      total++;
      var t = tally(r, allMembers(r), kind, j);
      if (!t) return;
      done++; att += t.att; base += t.base;
    });
    return { att: att, base: base, done: done, total: total, rate: base ? att / base : null };
  }

  function pct(x){ return x == null ? '—' : Math.round(x * 100) + '%'; }
  function heatColor(kind, rate){
    var pal = HEAT[kind];
    var i = Math.min(pal.length - 1, Math.floor(rate * pal.length));
    return { bg: pal[i], fg: i >= 4 ? '#fff' : 'var(--ink)' };
  }
  function regionColor(r, i){
    var m = String(r.title).match(/(\d+)\s*지역/);
    var n = m ? Number(m[1]) : i + 1;
    return PALETTE[(n - 1 + PALETTE.length) % PALETTE.length];
  }
  function regionNo(r, i){
    var m = String(r.title).match(/(\d+)\s*지역/);
    return m ? m[1] : String(i + 1);
  }
  function leadOf(g){
    for (var k = 0; k < g.members.length; k++) if (g.members[k].lead) return g.members[k].name;
    return '';
  }
  function esc(s){
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function tel(phone){
    if (!phone) return '연락처 없음';
    return '<a href="tel:' + esc(phone.replace(/[^0-9+]/g, '')) + '">' + esc(phone) + '</a>';
  }

  /* ---------------- 그리기 ---------------- */
  function render(){
    if (!S.data.weeks.length){
      document.getElementById('body').innerHTML =
        '<div class="card"><div class="empty">아직 지난 주일이 없습니다. 첫 주일이 지나면 현황이 나타납니다.</div></div>';
      return;
    }
    renderWeeks(); renderCards(); renderChecks();
    renderHeat('w', 'heatW', 'scaleW');
    renderHeat('g', 'heatG', 'scaleG');
    document.getElementById('foot').textContent =
      '시트에 있는 정보만 사용합니다. 오늘 이후 날짜는 넣지 않고, 한 지역에서 아무도 체크하지 않은 주는 ' +
      '아직 기록하지 않은 주로 보고 출석률 계산에서 뺍니다. 지역장 행은 순 안의 같은 이름과 겹치므로 셈에서 뺐습니다.';
  }

  function setWeek(j){ S.week = j; render(); }

  function renderWeeks(){
    var box = document.getElementById('weeks');
    box.innerHTML = S.data.weeks.map(function(w, j){
      return '<button class="wk' + (j === S.week ? ' on' : '') + '" onclick="setWeek(' + j + ')">' +
        w.month + '월 ' + w.day + '일</button>';
    }).join('');
    var on = box.querySelector('.wk.on');
    if (on) box.scrollLeft = on.offsetLeft - box.offsetLeft - 40;
  }

  // 지난주와 비교할 때는 두 주 모두 기록한 지역끼리만 센다(미기록 지역 때문에 줄어 보이지 않도록)
  function delta(kind, j){
    if (j <= 0) return '<span class="same">지난주 비교 없음</span>';
    var now = 0, prev = 0, n = 0, total = 0;
    S.data.regions.forEach(function(r){
      if (!applies(r, kind)) return;
      total++;
      var a = tally(r, allMembers(r), kind, j), b = tally(r, allMembers(r), kind, j - 1);
      if (!a || !b) return;
      now += a.att; prev += b.att; n++;
    });
    if (!n) return '<span class="same">지난주 비교 없음</span>';
    var d = now - prev;
    var note = n < total ? ' <span class="same">(' + n + '개 지역 비교)</span>' : '';
    if (d > 0) return '지난주보다 <span class="up">▲ ' + d + '명</span>' + note;
    if (d < 0) return '지난주보다 <span class="down">▼ ' + (-d) + '명</span>' + note;
    return '<span class="same">지난주와 같음</span>' + note;
  }

  function renderCards(){
    var j = S.week;
    var w = weekStats('w', j), g = weekStats('g', j);
    document.getElementById('cards').innerHTML =
      '<div class="kpi"><small><i style="background:var(--w)"></i>주일예배 출석</small>' +
        '<b>' + (w.done ? w.att : '—') + '<em>명 · ' + pct(w.rate) + '</em></b><p>' + delta('w', j) + '</p></div>' +
      '<div class="kpi"><small><i style="background:var(--g)"></i>순모임 참석</small>' +
        '<b>' + (g.done ? g.att : '—') + '<em>명 · ' + pct(g.rate) + '</em></b><p>' + delta('g', j) + '</p></div>' +
      '<div class="kpi' + ((w.done < w.total || g.done < g.total) ? ' alert' : '') + '"><small>기록 완료 지역</small>' +
        '<b>' + w.done + '<em>/ ' + w.total + ' 지역 (예배)</em></b>' +
        '<p>순모임 ' + g.done + ' / ' + g.total + ' 지역</p></div>';
  }

  function renderChecks(){
    var j = S.week, items = [];
    var lab = S.data.weeks[j].month + '월 ' + S.data.weeks[j].day + '일';
    document.getElementById('checkSub').textContent = lab + ' 기준';

    function missing(kind){
      var list = [];
      S.data.regions.forEach(function(r){
        if (!applies(r, kind)) return;
        if (!S.rec[r.id][kind][j]) {
          list.push(esc(r.title) + ' (지역장 ' + esc(r.leader || '미지정') + ' ' + tel(r.leaderPhone) + ')');
        }
      });
      return list;
    }
    var mw = missing('w'), mg = missing('g');
    items.push(mw.length
      ? { ok: false, t: '주일예배 미기록 ' + mw.length + '개 지역', d: mw.join('<br>') }
      : { ok: true, t: '주일예배는 모든 지역이 기록했습니다' });
    items.push(mg.length
      ? { ok: false, t: '순모임 미기록 ' + mg.length + '개 지역', d: mg.join('<br>') }
      : { ok: true, t: '순모임은 모든 지역이 기록했습니다' });

    var noGroup = S.data.regions.filter(function(r){ return !r.hasGroup; }).map(function(r){ return esc(r.title); });
    if (noGroup.length) items.push({ ok: false, t: '순모임 칸이 없는 지역', d: noGroup.join(', ') });

    var noLead = [];
    S.data.regions.forEach(function(r){
      r.groups.forEach(function(g){ if (!leadOf(g)) noLead.push(esc(regionNo(r, 0)) + '지역 ' + esc(g.name)); });
    });
    if (noLead.length) items.push({ ok: false, t: '순장이 굵은 글씨로 표시되지 않은 순 ' + noLead.length + '곳', d: noLead.join(', ') });

    // 같은 경고가 여러 지역에 있으면 한 줄로 묶는다
    var warn = {};
    S.data.regions.forEach(function(r){
      (r.warnings || []).forEach(function(w){ (warn[w] = warn[w] || []).push(regionNo(r, 0) + '지역'); });
    });
    Object.keys(warn).forEach(function(w){
      items.push({ ok: false, t: '시트 머리글 확인 필요', d: esc(w) + '<br>해당: ' + warn[w].join(', ') });
    });
    (S.data.errors || []).forEach(function(e){ items.push({ ok: false, t: '읽지 못한 탭', d: esc(e) }); });

    document.getElementById('checks').innerHTML = items.map(function(it){
      return '<div class="chk"><span class="ic ' + (it.ok ? 'ok">✓' : 'warn">!') + '</span>' +
        '<div class="tx"><b>' + it.t + '</b>' + (it.d ? '<div>' + it.d + '</div>' : '') + '</div></div>';
    }).join('');
  }

  // 두 표를 따로 펼치고 접을 수 있도록 표 종류와 지역을 함께 기억한다
  function toggleRegion(kind, id){
    var key = kind + ':' + id;
    S.open[key] = !S.open[key];
    renderHeat(kind, kind === 'g' ? 'heatG' : 'heatW', kind === 'g' ? 'scaleG' : 'scaleW');
  }

  function renderHeat(kind, heatId, scaleId){
    var n = S.data.weeks.length;
    function cells(r, members){
      var html = '', att = 0, base = 0;
      for (var j = 0; j < n; j++){
        var t = tally(r, members, kind, j);
        var sel = j === S.week ? ' sel' : '';
        if (!t){ html += '<td class="c na' + sel + '">·</td>'; continue; }
        att += t.att; base += t.base;
        var c = heatColor(kind, t.rate);
        html += '<td class="c' + sel + '" style="background:' + c.bg + ';color:' + c.fg + '" title="' +
          t.att + '/' + t.base + '명">' + Math.round(t.rate * 100) + '</td>';
      }
      var avg = base ? att / base : null;
      html += '<td class="avg" style="color:' + (avg == null ? 'var(--muted)' : avg >= .75 ? 'var(--good)' : avg >= .5 ? 'var(--mid)' : 'var(--low)') + '">' + pct(avg) + '</td>';
      return html;
    }
    var head = '<tr><th class="rh">지역 / 순</th>' + S.data.weeks.map(function(w, j){
      return '<th class="' + (j === S.week ? 'sel' : '') + '">' + w.month + '/' + w.day + '</th>';
    }).join('') + '<th>평균</th></tr>';

    var body = '';
    S.data.regions.forEach(function(r, i){
      if (!applies(r, kind)){
        body += '<tr class="rr"><th class="rh"><span class="bd" style="background:' + regionColor(r, i) + '">' +
          esc(regionNo(r, i)) + '</span>' + esc(regionNo(r, i)) + '지역<small>순모임 칸 없음</small></th>' +
          '<td colspan="' + (n + 1) + '" style="color:var(--muted);font-size:12px">—</td></tr>';
        return;
      }
      var open = !!S.open[kind + ':' + r.id];
      body += '<tr class="rr" onclick="toggleRegion(\'' + kind + '\', \'' + esc(r.id).replace(/'/g, "\\'") + '\')">' +
        '<th class="rh"><span class="bd" style="background:' + regionColor(r, i) + '">' + esc(regionNo(r, i)) + '</span>' +
        esc(regionNo(r, i)) + '지역<small>' + esc(r.leader) + '</small><span class="arr">' + (open ? '▼' : '▶') + '</span></th>' +
        cells(r, allMembers(r)) + '</tr>';
      if (open){
        r.groups.forEach(function(g){
          var ld = leadOf(g);
          body += '<tr class="sub"><th class="rh">' + esc(g.name) + '<small>' + (ld ? '순장 ' + esc(ld) : g.members.length + '명') + '</small></th>' +
            cells(r, g.members) + '</tr>';
        });
      }
    });
    var wrap = document.getElementById(heatId);
    wrap.innerHTML = '<table class="hm"><thead>' + head + '</thead><tbody>' + body + '</tbody></table>';
    // 휴대폰에서도 선택한 주가 바로 보이도록 표를 옆으로 넘겨 둔다
    var selTh = wrap.querySelector('thead th.sel');
    if (selTh) wrap.scrollLeft = Math.max(0, selTh.offsetLeft - wrap.clientWidth + selTh.offsetWidth + 60);
    document.getElementById(scaleId).innerHTML = '출석률 ' +
      HEAT[kind].map(function(c){ return '<i style="background:' + c + '"></i>'; }).join('') +
      ' <span>0 → 100%</span> · <i style="background:repeating-linear-gradient(45deg,#f3efe8,#f3efe8 4px,#faf8f5 4px,#faf8f5 8px)"></i> 아직 기록 안 한 주';
  }

  var toastTimer = null;
  function toast(t){
    var el = document.getElementById('toast');
    el.textContent = t; el.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('on'); }, 1800);
  }
</script>
</body>
</html>
