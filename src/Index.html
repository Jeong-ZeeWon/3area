<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<title><?= appTitle ?></title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ========================= 토큰 ========================= */
:root{
  --brand:#2E7D5B;
  --brand-dark:#22614a;
  --brand-soft:rgba(46,125,91,.10);
  --brand-line:rgba(46,125,91,.32);
  --brand-ring:rgba(46,125,91,.30);

  --paper:#f4f2ee;
  --card:#ffffff;
  --card-2:#faf8f5;
  --line:#e8e3da;
  --line-2:#f0ece5;
  --ink:#1c1a17;
  --ink-2:#4e483f;
  --muted:#8c847a;
  --chk:#cbc3b6;

  --gold:#b0842d;
  --rose:#b04936;
  --rose-soft:#fdeeea;

  --r-xl:24px; --r-lg:18px; --r-md:14px; --r-sm:10px;
  --sh-1:0 1px 2px rgba(28,26,23,.04), 0 3px 12px rgba(28,26,23,.05);
  --sh-2:0 2px 8px rgba(28,26,23,.07), 0 18px 40px rgba(28,26,23,.13);
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#141618; --card:#1e2225; --card-2:#191d20;
    --line:#31383d; --line-2:#272d31;
    --ink:#f1ede6; --ink-2:#c7c1b7; --muted:#938e87;
    --chk:#4c545a;
    --rose-soft:#2c1d19;
  }
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  font-size:16px; line-height:1.55; letter-spacing:-.012em;
  padding-bottom:104px; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit; color:inherit;}

/* ========================= 상단 ========================= */
.appbar{position:sticky; top:0; z-index:40;}
.hero{
  background:
    radial-gradient(130% 150% at 88% -40%, rgba(255,255,255,.24), transparent 58%),
    linear-gradient(160deg, var(--brand) 0%, var(--brand-dark) 100%);
  color:#fff; padding:15px 16px 14px;
  box-shadow:0 8px 28px rgba(0,0,0,.16);
}
.hero-in{max-width:660px; margin:0 auto;}
.hero-top{display:flex; align-items:center; gap:11px;}
.mark{
  flex:0 0 auto; min-width:38px; height:38px; padding:0 9px; border-radius:12px;
  background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.22);
  display:flex; align-items:center; justify-content:center;
  font-size:14px; font-weight:700; letter-spacing:-.03em; white-space:nowrap;
}
.hero-txt{flex:1; min-width:0;}
.hero-txt h1{
  margin:0; font-size:17.5px; font-weight:700; letter-spacing:-.025em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.hero-txt p{margin:1px 0 0; font-size:12.5px; opacity:.8;}
.ico{
  flex:0 0 auto; width:38px; height:38px; border-radius:12px; cursor:pointer;
  background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.2);
  font-size:17px; display:flex; align-items:center; justify-content:center;
  transition:background .15s;
}
.ico:active{background:rgba(255,255,255,.32);}

/* 토글 선택기 */
.selects{display:flex; gap:9px; margin-top:13px;}
.sel{
  flex:1; min-width:0; display:flex; align-items:center; gap:8px; cursor:pointer;
  background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.26);
  border-radius:14px; padding:9px 12px; text-align:left;
  transition:background .16s, border-color .16s, color .16s;
}
.sel:active{background:rgba(255,255,255,.28);}
.sel.open{background:#fff; border-color:#fff; color:var(--brand-dark);}
.sel-body{flex:1; min-width:0;}
.sel-label{display:block; font-size:10.5px; font-weight:500; opacity:.72; letter-spacing:.04em;}
.sel-value{
  display:block; font-size:15.5px; font-weight:700; letter-spacing:-.03em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.chev{flex:0 0 auto; font-size:10px; opacity:.8; transition:transform .22s;}
.sel.open .chev{transform:rotate(180deg);}
.sel[disabled]{opacity:.5;}

/* 펼침 패널 */
.panel{
  position:absolute; left:0; right:0; top:100%; z-index:41;
  background:var(--card); border-bottom:1px solid var(--line);
  border-radius:0 0 var(--r-xl) var(--r-xl);
  box-shadow:var(--sh-2);
  max-height:0; overflow:hidden; opacity:0; pointer-events:none;
  transition:max-height .26s cubic-bezier(.4,0,.2,1), opacity .18s;
}
.panel.open{max-height:64vh; overflow-y:auto; opacity:1; pointer-events:auto;}
.panel-in{max-width:660px; margin:0 auto; padding:16px 16px 20px;}
.panel-title{
  font-size:11.5px; font-weight:700; color:var(--muted);
  letter-spacing:.06em; margin:0 0 11px;
}
.scrim{
  position:fixed; inset:0; z-index:35; background:rgba(18,16,14,.44);
  opacity:0; pointer-events:none; transition:opacity .2s;
}
.scrim.on{opacity:1; pointer-events:auto;}

/* 지역 목록 */
.rgrid{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
@media (min-width:540px){ .rgrid{grid-template-columns:repeat(3,1fr);} }
.rtile{
  display:flex; align-items:center; gap:10px; cursor:pointer;
  background:var(--card-2); border:1.5px solid var(--line); border-radius:var(--r-md);
  padding:11px 12px; text-align:left; transition:transform .12s, border-color .16s, background .16s;
}
.rtile:active{transform:scale(.975);}
.rtile.on{border-color:var(--tile); background:var(--tile-soft);}
.rbadge{
  flex:0 0 auto; width:34px; height:34px; border-radius:11px; background:var(--tile);
  color:#fff; display:flex; align-items:center; justify-content:center;
  font-size:15px; font-weight:700;
}
.rtxt{min-width:0;}
.rtxt b{display:block; font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.rtxt span{display:block; font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

/* 날짜 목록 */
.mrow{margin-bottom:15px;}
.mrow:last-child{margin-bottom:0;}
.mlabel{font-size:12.5px; font-weight:700; color:var(--ink-2); margin:0 0 8px;}
.dgrid{display:grid; grid-template-columns:repeat(5,1fr); gap:8px;}
.dbtn{
  position:relative; cursor:pointer; border-radius:var(--r-md);
  background:var(--card-2); border:1.5px solid var(--line);
  padding:9px 3px 7px; display:flex; flex-direction:column; align-items:center;
  line-height:1.15; transition:transform .12s, border-color .16s, background .16s;
}
.dbtn:active{transform:scale(.95);}
.dbtn b{font-size:18px; font-weight:700;}
.dbtn small{font-size:10px; color:var(--muted); margin-top:2px; min-height:13px;}
.dbtn.today{border-color:var(--brand-line);}
.dbtn.on{background:var(--brand); border-color:var(--brand);}
.dbtn.on b{color:#fff;}
.dbtn.on small{color:rgba(255,255,255,.85);}
.flag{
  position:absolute; top:-7px; right:-3px; font-size:9px; font-weight:700;
  background:var(--gold); color:#fff; padding:1px 5px; border-radius:99px;
}

/* ========================= 본문 ========================= */
.wrap{max-width:660px; margin:0 auto; padding:16px 14px 0;}

.hint-card{
  display:flex; align-items:center; gap:12px;
  background:var(--card); border:1px dashed var(--brand-line); border-radius:var(--r-lg);
  padding:17px 18px; margin-bottom:14px;
}
.hint-card .up{font-size:19px; color:var(--brand);}
.hint-card b{display:block; font-size:15px;}
.hint-card i{display:block; font-style:normal; font-size:13px; color:var(--muted);}

/* 요약 */
.sumcard{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r-xl);
  box-shadow:var(--sh-1); margin-bottom:14px; overflow:hidden;
}
.sum{display:flex; align-items:center; gap:17px; padding:17px 18px 15px;}
.ring{position:relative; flex:0 0 auto; width:88px; height:88px;}
.ring-txt{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1;}
.ring-txt b{font-size:22px; font-weight:700; color:var(--brand);}
.ring-txt small{font-size:10px; color:var(--muted); margin-top:3px;}
.sside{flex:1; min-width:0;}
.sside .cap{font-size:12px; color:var(--muted); font-weight:500;}
.sside .big{font-size:25px; font-weight:700; letter-spacing:-.035em; margin:1px 0 9px;}
.sside .big em{font-style:normal; font-size:14.5px; font-weight:500; color:var(--muted); margin-left:4px;}
.meter{height:8px; border-radius:99px; background:var(--line-2); overflow:hidden;}
.meter i{display:block; height:100%; border-radius:99px; background:var(--brand); transition:width .4s cubic-bezier(.4,0,.2,1);}
.legend{display:flex; gap:13px; margin-top:8px; font-size:12px; color:var(--muted);}
.legend span{display:inline-flex; align-items:center; gap:5px;}
.legend i{width:7px; height:7px; border-radius:50%;}
.legend .p{background:var(--brand);} .legend .a{background:var(--line);}

.quick{display:flex; gap:7px; padding:0 14px 14px;}
.qbtn{
  flex:1; background:var(--card-2); border:1px solid var(--line); border-radius:var(--r-sm);
  padding:10px 5px; font-size:13px; font-weight:500; color:var(--ink-2); cursor:pointer;
  transition:background .15s, border-color .15s;
}
.qbtn:active{background:var(--brand-soft); border-color:var(--brand-line);}

/* 순 카드 */
.group{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r-xl);
  box-shadow:var(--sh-1); margin-bottom:13px; overflow:hidden;
}
.ghead{display:flex; align-items:center; gap:9px; padding:13px 15px 12px; background:var(--card-2); border-bottom:1px solid var(--line-2);}
.gname{font-size:15px; font-weight:700; letter-spacing:-.025em;}
.gpill{font-size:11.5px; font-weight:700; color:var(--brand); background:var(--brand-soft); padding:3px 9px; border-radius:99px;}
.gall{
  margin-left:auto; background:transparent; border:1px solid var(--line);
  border-radius:99px; padding:6px 13px; font-size:12px; font-weight:500;
  color:var(--ink-2); cursor:pointer;
}
.gall:active{background:var(--brand-soft); border-color:var(--brand-line);}
.gbar{height:3px; background:var(--line-2);}
.gbar i{display:block; height:100%; background:var(--brand); transition:width .35s;}

.list{list-style:none; margin:0; padding:0;}
.list li + li{border-top:1px solid var(--line-2);}
.row{
  position:relative; display:flex; align-items:center; gap:12px;
  padding:11px 15px; cursor:pointer; user-select:none; transition:background .16s;
}
.row::before{content:''; position:absolute; left:0; top:0; bottom:0; width:0; background:var(--brand); transition:width .18s;}
.row:active{background:var(--card-2);}
.row.on{background:var(--brand-soft);}
.row.on::before{width:4px;}
.ava{
  flex:0 0 auto; width:40px; height:40px; border-radius:50%;
  background:var(--card-2); border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center;
  font-size:15.5px; font-weight:700; color:var(--ink-2);
  transition:background .18s, color .18s, border-color .18s;
}
.row.on .ava{background:var(--brand); border-color:var(--brand); color:#fff;}
.who{flex:1; min-width:0;}
.who .nm{display:block; font-size:16px; font-weight:500; letter-spacing:-.025em;}
.row.on .who .nm{font-weight:700;}
.who .ph{display:inline-block; font-size:12px; color:var(--muted); text-decoration:none;}
.who .ph:active{color:var(--brand);}
.chk{
  flex:0 0 auto; width:28px; height:28px; border-radius:50%;
  border:2px solid var(--chk); background:var(--card);
  display:flex; align-items:center; justify-content:center;
  font-size:15px; color:transparent; transition:all .18s;
}
.row.on .chk{background:var(--brand); border-color:var(--brand); color:#fff; box-shadow:0 2px 8px var(--brand-ring);}

/* 하단 */
.footbar{
  position:fixed; left:0; right:0; bottom:0; z-index:34;
  background:var(--card); border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 22px rgba(28,26,23,.08);
}
.ftop{
  flex:0 0 auto; width:36px; height:36px; border-radius:11px; cursor:pointer;
  background:var(--card-2); border:1px solid var(--line); color:var(--ink-2);
  font-size:11px; display:flex; align-items:center; justify-content:center;
  transition:background .15s;
}
.ftop:active{background:var(--brand-soft);}
.footbar-in{max-width:660px; margin:0 auto; display:flex; align-items:center; gap:11px;}
.status{flex:1; min-width:0; display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted);}
.sdot{width:9px; height:9px; border-radius:50%; background:var(--line); flex:0 0 auto;}
.status.saving{color:var(--gold);} .status.saving .sdot{background:var(--gold); animation:pulse 1s infinite;}
.status.saved{color:var(--brand);} .status.saved .sdot{background:var(--brand);}
.status.error{color:var(--rose); font-weight:700;} .status.error .sdot{background:var(--rose);}
@keyframes pulse{0%,100%{opacity:1} 50%{opacity:.25}}
.btn{
  flex:0 0 auto; background:linear-gradient(140deg, var(--brand), var(--brand-dark));
  color:#fff; border:0; border-radius:13px; padding:11px 19px;
  font-size:14.5px; font-weight:700; cursor:pointer; box-shadow:0 4px 14px var(--brand-ring);
}
.btn:active{transform:translateY(1px);}

/* 기타 */
input[type=tel]{
  width:100%; padding:14px 16px; border:1.5px solid var(--line); border-radius:var(--r-md);
  font-size:22px; font-family:inherit; letter-spacing:.3em; text-align:center;
  background:var(--card-2); color:var(--ink); margin:14px 0 12px;
}
input[type=tel]:focus{outline:none; border-color:var(--brand); background:var(--card);}
.card-pad{background:var(--card); border:1px solid var(--line); border-radius:var(--r-xl); box-shadow:var(--sh-1); padding:20px; margin-bottom:14px;}
.card-pad h2{margin:0 0 5px; font-size:16.5px; font-weight:700; letter-spacing:-.025em;}
.card-pad p{margin:0; font-size:13.5px; color:var(--muted);}
.alert{
  padding:13px 15px; border-radius:var(--r-sm); background:var(--rose-soft);
  color:var(--rose); font-size:14px; font-weight:500; margin-bottom:12px;
}
.skel{padding:44px 0; text-align:center; color:var(--muted); font-size:14px;}
.spin{width:28px; height:28px; margin:0 auto 13px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--brand); animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.note{text-align:center; color:var(--muted); font-size:11.5px; padding:2px 0 18px;}
.hidden{display:none !important;}
</style>
</head>
<body>

<div class="appbar">
  <div class="hero">
    <div class="hero-in">
      <div class="hero-top">
        <div class="mark" id="mark">출석</div>
        <div class="hero-txt">
          <h1 id="title"><?= appTitle ?></h1>
          <p id="subtitle">지역과 날짜를 골라 주세요</p>
        </div>
        <button class="ico" id="btnReload" onclick="reload()" title="새로고침">↻</button>
      </div>
      <div class="selects">
        <button class="sel" id="selRegion" onclick="togglePanel('region')">
          <span class="sel-body">
            <span class="sel-label">지역</span>
            <span class="sel-value" id="selRegionVal">선택하세요</span>
          </span>
          <span class="chev">▼</span>
        </button>
        <button class="sel" id="selDate" onclick="togglePanel('date')" disabled>
          <span class="sel-body">
            <span class="sel-label">날짜</span>
            <span class="sel-value" id="selDateVal">—</span>
          </span>
          <span class="chev">▼</span>
        </button>
      </div>
    </div>
  </div>

  <div class="panel" id="panelRegion">
    <div class="panel-in">
      <p class="panel-title">지역 선택</p>
      <div class="rgrid" id="regionList"></div>
    </div>
  </div>

  <div class="panel" id="panelDate">
    <div class="panel-in">
      <p class="panel-title">주일 선택</p>
      <div id="dateList"></div>
    </div>
  </div>
</div>

<div class="scrim" id="scrim" onclick="closePanels()"></div>

<div class="wrap">

  <section id="viewIntro" class="hidden">
    <div class="hint-card" id="introCard">
      <span class="up">▲</span>
      <span>
        <b>위에서 지역을 선택하세요</b>
        <i>지역을 고르면 순별 명단과 주일 날짜가 열립니다.</i>
      </span>
    </div>
  </section>

  <section id="viewCode" class="hidden">
    <div class="card-pad">
      <h2 id="codeTitle">접속코드 입력</h2>
      <p>교구에서 안내받은 번호를 입력해 주세요.</p>
      <div id="codeMsg" class="alert hidden"></div>
      <input type="tel" id="codeInput" inputmode="numeric" placeholder="0000" maxlength="8">
      <button class="btn" style="width:100%" onclick="submitCode()">확인</button>
    </div>
  </section>

  <section id="viewSheet" class="hidden">
    <div class="sumcard">
      <div class="sum">
        <div class="ring">
          <svg width="88" height="88" viewBox="0 0 88 88" style="transform:rotate(-90deg)">
            <circle cx="44" cy="44" r="37" fill="none" stroke="var(--line-2)" stroke-width="9"></circle>
            <circle id="ringArc" cx="44" cy="44" r="37" fill="none" stroke="var(--brand)"
                    stroke-width="9" stroke-linecap="round"
                    stroke-dasharray="232.5" stroke-dashoffset="232.5"
                    style="transition:stroke-dashoffset .5s cubic-bezier(.4,0,.2,1)"></circle>
          </svg>
          <div class="ring-txt"><b id="pctTxt">0%</b><small>출석률</small></div>
        </div>
        <div class="sside">
          <div class="cap" id="sumCap">—</div>
          <div class="big"><span id="cntPresent">0</span><em>/ <span id="cntTotal">0</span>명</em></div>
          <div class="meter"><i id="meterBar" style="width:0%"></i></div>
          <div class="legend">
            <span><i class="p"></i>출석 <b id="lgP">0</b></span>
            <span><i class="a"></i>미출석 <b id="lgA">0</b></span>
          </div>
        </div>
      </div>
      <div class="quick">
        <button class="qbtn" onclick="markAll(true)">전체 출석</button>
        <button class="qbtn" onclick="markAll(false)">전체 해제</button>
        <button class="qbtn" onclick="copyAbsent()">미출석 복사</button>
      </div>
    </div>

    <div id="groups"></div>
    <p class="note" id="note"></p>
  </section>

  <div id="loading" class="skel"><div class="spin"></div>불러오는 중입니다…</div>
</div>

<div class="footbar hidden" id="bar">
  <div class="footbar-in">
    <button class="ftop" onclick="toTop()" title="맨 위로">▲</button>
    <div class="status" id="status"><i class="sdot"></i><span id="statusTxt">체크하면 자동으로 저장됩니다</span></div>
    <button class="btn" onclick="flush(true)">지금 저장</button>
  </div>
</div>

<script>
  var USE_CODE = <?!= useCode ? 'true' : 'false' ?>;
  var LOCKED = <?!= JSON.stringify(lockedRegion) ?>;
  var APP_TITLE = <?!= JSON.stringify(appTitle) ?>;

  var PALETTE = ['#2E7D5B','#3A6EA5','#8D5BA6','#BF6B36','#42806B',
                 '#5F63C4','#A8506A','#2C8683','#8C6B2A','#55697C'];

  var state = {
    regions: [], region: null, data: null, dateIndex: 0,
    code: '', pending: {}, timer: null, sending: false, panel: null
  };

  /* ---------------- 색상 ---------------- */
  function rgbOf(hex){
    var h = hex.replace('#','');
    return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)];
  }
  function shade(hex, k){
    return 'rgb(' + rgbOf(hex).map(function(v){
      return Math.max(0, Math.min(255, Math.round(v * k)));
    }).join(',') + ')';
  }
  function alphaOf(hex, a){ return 'rgba(' + rgbOf(hex).join(',') + ',' + a + ')'; }

  function setBrand(hex){
    var s = document.documentElement.style;
    s.setProperty('--brand', hex);
    s.setProperty('--brand-dark', shade(hex, .76));
    s.setProperty('--brand-soft', alphaOf(hex, .10));
    s.setProperty('--brand-line', alphaOf(hex, .32));
    s.setProperty('--brand-ring', alphaOf(hex, .30));
  }
  function regionNo(r, i){
    var m = String((r && r.title) || '').match(/(\d+)\s*지역/);
    return m ? m[1] : String((i || 0) + 1);
  }
  function colorFor(r, i){
    var n = Number(regionNo(r, i));
    return PALETTE[(n - 1 + PALETTE.length) % PALETTE.length];
  }

  /* ---------------- 화면 ---------------- */
  function showView(id){
    ['viewIntro','viewCode','viewSheet','loading'].forEach(function(v){
      document.getElementById(v).classList.add('hidden');
    });
    document.getElementById(id).classList.remove('hidden');
    var open = (id === 'viewSheet');
    document.getElementById('bar').classList.toggle('hidden', !open);
    document.getElementById('selDate').disabled = !open;
  }

  function setStatus(text, cls){
    document.getElementById('statusTxt').textContent = text;
    document.getElementById('status').className = 'status ' + (cls || '');
  }

  /* ---------------- 토글 패널 ---------------- */
  function togglePanel(which){
    if (which === 'region' && LOCKED) return;
    if (which === 'date' && !state.data) return;
    setPanel(state.panel === which ? null : which);
  }
  function closePanels(){ setPanel(null); }

  function setPanel(which){
    state.panel = which;
    [['region','panelRegion','selRegion'], ['date','panelDate','selDate']].forEach(function(t){
      var on = (which === t[0]);
      document.getElementById(t[1]).classList.toggle('open', on);
      document.getElementById(t[2]).classList.toggle('open', on);
    });
    document.getElementById('scrim').classList.toggle('on', !!which);
  }

  /* ---------------- 시작 ---------------- */
  window.addEventListener('load', function(){
    showView('loading');
    if (LOCKED){
      document.getElementById('selRegion').setAttribute('disabled', 'disabled');
      state.region = { id: LOCKED, title: '', leader: '' };
      openRegion();
      return;
    }
    google.script.run.withSuccessHandler(function(list){
      state.regions = list || [];
      renderRegions();
      showView('viewIntro');
      if (state.regions.length){
        setPanel('region');
      } else {
        document.getElementById('introCard').outerHTML =
          '<div class="alert">출석부 시트를 찾지 못했습니다. 시트 형식을 확인해 주세요.</div>';
      }
    }).withFailureHandler(fail).getRegions();
  });

  function renderRegions(){
    var box = document.getElementById('regionList');
    box.innerHTML = '';
    state.regions.forEach(function(r, i){
      var color = colorFor(r, i);
      var b = document.createElement('button');
      b.className = 'rtile' + (state.region && state.region.id === r.id ? ' on' : '');
      b.style.setProperty('--tile', color);
      b.style.setProperty('--tile-soft', alphaOf(color, .09));
      b.innerHTML =
        '<span class="rbadge">' + esc(regionNo(r, i)) + '</span>' +
        '<span class="rtxt"><b>' + esc(r.title) + '</b><span>' +
        (r.leader ? esc(r.leader) : '지역장 미지정') + '</span></span>';
      b.onclick = function(){
        if (state.region && state.region.id === r.id){ setPanel(null); return; }
        if (Object.keys(state.pending).length) flush(true);
        state.region = r;
        state.code = '';
        setBrand(color);
        renderRegions();
        setPanel(null);
        openRegion();
      };
      box.appendChild(b);
    });
  }

  function openRegion(){
    document.getElementById('selRegionVal').textContent = state.region.title || '불러오는 중';
    if (USE_CODE && !state.code){
      document.getElementById('codeTitle').textContent = (state.region.title || '지역') + ' 접속코드';
      document.getElementById('codeMsg').classList.add('hidden');
      document.getElementById('codeInput').value = '';
      showView('viewCode');
      setTimeout(function(){ document.getElementById('codeInput').focus(); }, 120);
      return;
    }
    loadData();
  }

  function submitCode(){
    state.code = document.getElementById('codeInput').value.trim();
    loadData();
  }

  function loadData(){
    showView('loading');
    google.script.run
      .withSuccessHandler(function(data){
        state.data = data;
        state.dateIndex = data.defaultDateIndex || 0;
        if (LOCKED) setBrand(colorFor(data, 0));

        document.getElementById('mark').textContent = regionNo(data, 0) + '지역';
        document.getElementById('title').textContent = data.title;
        document.getElementById('subtitle').textContent =
          (data.leader ? '지역장 ' + data.leader + ' · ' : '') + countAll() + '명';
        document.getElementById('selRegionVal').textContent = data.title;

        renderDates(); renderGroups();
        showView('viewSheet');
        setStatus('체크하면 자동으로 저장됩니다');
      })
      .withFailureHandler(function(err){
        if (USE_CODE && /접속코드/.test(err.message || '')){
          var m = document.getElementById('codeMsg');
          m.textContent = '접속코드가 올바르지 않습니다. 다시 입력해 주세요.';
          m.classList.remove('hidden');
          state.code = '';
          showView('viewCode');
          return;
        }
        fail(err);
      })
      .getRegionData(state.region.id, state.code);
  }

  function reload(){
    if (!state.region){ location.reload(); return; }
    if (Object.keys(state.pending).length) flush(true);
    loadData();
  }

  function countAll(){
    var n = 0;
    state.data.groups.forEach(function(g){ n += g.members.length; });
    return n;
  }

  /* ---------------- 날짜 ---------------- */
  function renderDates(){
    var box = document.getElementById('dateList');
    box.innerHTML = '';

    var months = [];
    state.data.dates.forEach(function(d, i){
      var last = months[months.length - 1];
      if (!last || last.month !== d.month) months.push({ month: d.month, items: [] });
      months[months.length - 1].items.push({ d: d, i: i });
    });

    months.forEach(function(mo){
      var wrap = document.createElement('div');
      wrap.className = 'mrow';
      var lab = document.createElement('p');
      lab.className = 'mlabel';
      lab.textContent = mo.month + '월';
      wrap.appendChild(lab);

      var grid = document.createElement('div');
      grid.className = 'dgrid';
      mo.items.forEach(function(it){
        var filled = 0;
        state.data.groups.forEach(function(g){
          g.members.forEach(function(m){ if (m.marks[it.i]) filled++; });
        });
        var isToday = (it.i === state.data.defaultDateIndex);
        var b = document.createElement('button');
        b.className = 'dbtn' + (it.i === state.dateIndex ? ' on' : '') + (isToday ? ' today' : '');
        b.innerHTML = '<b>' + it.d.day + '</b><small>' + (filled ? filled + '명' : '') + '</small>' +
          (isToday ? '<span class="flag">오늘</span>' : '');
        b.onclick = function(){
          flush(true);
          state.dateIndex = it.i;
          setPanel(null);
          renderDates(); renderGroups();
        };
        grid.appendChild(b);
      });
      wrap.appendChild(grid);
      box.appendChild(wrap);
    });

    document.getElementById('selDateVal').textContent = state.data.dates[state.dateIndex].label;
  }

  /* ---------------- 명단 ---------------- */
  function renderGroups(){
    var box = document.getElementById('groups');
    box.innerHTML = '';
    var di = state.dateIndex;

    state.data.groups.forEach(function(g, gi){
      var on = g.members.filter(function(m){ return m.marks[di]; }).length;

      var sec = document.createElement('div');
      sec.className = 'group';

      var head = document.createElement('div');
      head.className = 'ghead';
      head.innerHTML =
        '<span class="gname">' + esc(g.name) + '</span>' +
        '<span class="gpill" id="gp' + gi + '">' + on + ' / ' + g.members.length + '</span>';
      var all = document.createElement('button');
      all.className = 'gall';
      all.textContent = '순 전체';
      all.onclick = function(){ toggleGroup(gi); };
      head.appendChild(all);
      sec.appendChild(head);

      var bar = document.createElement('div');
      bar.className = 'gbar';
      bar.innerHTML = '<i id="gb' + gi + '" style="width:' +
        (g.members.length ? Math.round(on / g.members.length * 100) : 0) + '%"></i>';
      sec.appendChild(bar);

      var ul = document.createElement('ul');
      ul.className = 'list';
      g.members.forEach(function(m, mi){
        var li = document.createElement('li');
        var row = document.createElement('div');
        row.className = 'row' + (m.marks[di] ? ' on' : '');
        row.id = 'r' + gi + '_' + mi;
        row.onclick = function(){ toggleOne(gi, mi); };
        var ph = m.phone
          ? '<a class="ph" href="tel:' + esc(m.phone.replace(/[^0-9+]/g,'')) +
            '" onclick="event.stopPropagation()">' + esc(m.phone) + '</a>'
          : '<span class="ph">연락처 없음</span>';
        row.innerHTML =
          '<span class="ava">' + esc(m.name.charAt(0)) + '</span>' +
          '<span class="who"><span class="nm">' + esc(m.name) + '</span>' + ph + '</span>' +
          '<span class="chk">✓</span>';
        li.appendChild(row);
        ul.appendChild(li);
      });
      sec.appendChild(ul);
      box.appendChild(sec);
    });
    updateSummary();
  }

  function updateSummary(){
    var di = state.dateIndex, total = 0, on = 0;
    state.data.groups.forEach(function(g, gi){
      var gOn = 0;
      g.members.forEach(function(m){ total++; if (m.marks[di]){ on++; gOn++; } });
      var p = document.getElementById('gp' + gi);
      if (p) p.textContent = gOn + ' / ' + g.members.length;
      var b = document.getElementById('gb' + gi);
      if (b) b.style.width = (g.members.length ? Math.round(gOn / g.members.length * 100) : 0) + '%';
    });

    var pct = total ? Math.round(on / total * 100) : 0;
    document.getElementById('cntPresent').textContent = on;
    document.getElementById('cntTotal').textContent = total;
    document.getElementById('lgP').textContent = on;
    document.getElementById('lgA').textContent = total - on;
    document.getElementById('pctTxt').textContent = pct + '%';
    document.getElementById('meterBar').style.width = pct + '%';
    document.getElementById('ringArc').setAttribute('stroke-dashoffset',
      String(232.5 - 232.5 * pct / 100));
    document.getElementById('sumCap').textContent = state.data.dates[di].label + ' 주일';
    document.getElementById('note').textContent =
      state.data.title + ' · ' + state.data.dates[di].label + ' 칸에 기록됩니다';
  }

  /* ---------------- 체크 ---------------- */
  function setMember(gi, mi, checked){
    var di = state.dateIndex;
    var m = state.data.groups[gi].members[mi];
    if (m.marks[di] === checked) return;
    m.marks[di] = checked;
    var row = document.getElementById('r' + gi + '_' + mi);
    if (row) row.classList.toggle('on', checked);
    var col = state.data.dates[di].col;
    state.pending[m.row + ':' + col] = { row: m.row, col: col, checked: checked };
  }

  function toggleOne(gi, mi){
    var di = state.dateIndex;
    setMember(gi, mi, !state.data.groups[gi].members[mi].marks[di]);
    updateSummary(); schedule();
  }

  function toggleGroup(gi){
    var di = state.dateIndex;
    var g = state.data.groups[gi];
    var allOn = g.members.every(function(m){ return m.marks[di]; });
    g.members.forEach(function(m, mi){ setMember(gi, mi, !allOn); });
    updateSummary(); schedule();
  }

  function markAll(checked){
    state.data.groups.forEach(function(g, gi){
      g.members.forEach(function(m, mi){ setMember(gi, mi, checked); });
    });
    updateSummary(); schedule();
  }

  /* ---------------- 저장 ---------------- */
  function schedule(){
    setStatus('저장 대기 중…', 'saving');
    if (state.timer) clearTimeout(state.timer);
    state.timer = setTimeout(function(){ flush(false); }, 900);
  }

  function flush(force){
    if (state.timer){ clearTimeout(state.timer); state.timer = null; }
    var keys = Object.keys(state.pending);
    if (!keys.length){ if (force) setStatus('저장할 변경 사항이 없습니다'); return; }
    if (state.sending){ state.timer = setTimeout(function(){ flush(false); }, 600); return; }

    var batch = keys.map(function(k){ return state.pending[k]; });
    var sent = state.pending;
    state.pending = {};
    state.sending = true;
    setStatus('저장 중입니다…', 'saving');

    google.script.run
      .withSuccessHandler(function(res){
        state.sending = false;
        setStatus('저장 완료 · ' + res.at, 'saved');
        renderDates();
        if (Object.keys(state.pending).length) schedule();
      })
      .withFailureHandler(function(){
        state.sending = false;
        Object.keys(sent).forEach(function(k){
          if (!state.pending[k]) state.pending[k] = sent[k];
        });
        setStatus('저장 실패 · [지금 저장]을 눌러 주세요', 'error');
      })
      .saveAttendance({ id: state.data.id, code: state.code, items: batch });
  }

  window.addEventListener('beforeunload', function(e){
    if (Object.keys(state.pending).length || state.sending){
      e.preventDefault(); e.returnValue = '';
    }
  });

  /* ---------------- 보조 ---------------- */
  function toTop(){
    try { window.scrollTo({ top: 0, behavior: 'smooth' }); }
    catch (e) { window.scrollTo(0, 0); }
  }

  function copyAbsent(){
    var di = state.dateIndex;
    var lines = [state.data.title + ' ' + state.data.dates[di].label + ' 미출석 명단'];
    state.data.groups.forEach(function(g){
      var names = g.members.filter(function(m){ return !m.marks[di]; })
                           .map(function(m){ return m.name; });
      if (names.length) lines.push(g.name + ': ' + names.join(', '));
    });
    var text = lines.join('\n');
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); setStatus('미출석 명단을 복사했습니다', 'saved'); }
    catch (e) { alert(text); }
    document.body.removeChild(ta);
  }

  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function fail(err){
    setPanel(null);
    var el = document.getElementById('loading');
    el.classList.remove('hidden');
    el.innerHTML = '<div class="alert">' +
      esc(err && err.message ? err.message : '불러오지 못했습니다.') + '</div>';
  }
</script>
</body>
</html>
